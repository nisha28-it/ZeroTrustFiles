services:
  opa:
    image: openpolicyagent/opa:latest
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "/policy/policy.rego"
    volumes:
      - ./policy/policy.rego:/policy/policy.rego:ro
    expose:
      - "8181"
    networks:
      - zerotrust

  app:
    build: ./app
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      OPA_URL: "http://opa:8181"
      STORAGE_DIR: "/data/storage"
      AUDIT_LOG: "/data/logs/access.log"
      FLASK_SECRET_KEY: "replace-this-demo-secret"
    volumes:
      - ./storage:/data/storage
      - ./logs:/data/logs
    depends_on:
      - opa
    networks:
      - zerotrust

networks:
  zerotrust:
    driver: bridge